name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge build --sizes
      - run: forge test

  web-and-rfq:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --dir app install --frozen-lockfile
      - run: forge build
        working-directory: contracts
      - run: pnpm --dir app gen:abis
      - run: pnpm test:e2e
      - run: pnpm --dir app lint
      - run: pnpm --dir app check:product-logic
      - run: pnpm --dir app check:auction-purchase
      - run: pnpm --dir app check:portfolio-balances
      - run: pnpm --dir app check:stock-swap
      - run: pnpm --dir app build
        env:
          SKIP_BUILD_RPC: "1"
      - run: pnpm --dir app check:export
      - run: pnpm --dir app check:stock-swap-browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm --dir app check:responsive
      - run: pnpm --dir app check:premium-history
        env:
          CHROME_PATH: /usr/bin/google-chrome
